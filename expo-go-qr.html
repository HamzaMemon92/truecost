<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expo Go QR</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
      }
      main {
        text-align: center;
        background: white;
        padding: 32px;
        border-radius: 8px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      }
      img {
        width: min(78vw, 520px);
        height: auto;
        image-rendering: pixelated;
      }
      p {
        margin: 20px 0 0;
        font-size: 22px;
        color: #111;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./expo-go-qr.svg" alt="Expo Go QR code for exp://10.173.104.158:8081" />
      <p>exp://10.173.104.158:8081</p>
    </main>
  </body>
</html>
