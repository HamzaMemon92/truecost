name: production-gates
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: truecost_test, POSTGRES_USER: truecost, POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U truecost" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://truecost:test@localhost:5432/truecost_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_SECRET_KEY: ci-only-auth-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt ruff mypy pip-audit
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: mypy app/category_catalog.py app/config.py app/models.py app/middleware.py app/api/endpoints/providers.py app/api/endpoints/health.py app/services/price_watcher.py app/tasks --ignore-missing-imports --follow-imports=skip
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
      - run: pip-audit
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run verify
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir dist-ci
      - run: python ../backend/scripts/generate_provider_catalog.py --check
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
      - uses: docker/setup-buildx-action@v3
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: ., severity: CRITICAL,HIGH, exit-code: "1" }
