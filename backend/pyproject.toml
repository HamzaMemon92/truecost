[project]
name = "decision-advisor-backend"
version = "0.1.0"
description = "Phase 1 backend for shopping intelligence using LangGraph, LangChain, and MCP-style tool boundaries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.1",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "deepagents>=0.7.0; python_version >= '3.11'",
  "langgraph>=1.0.0",
  "mcp>=1.0.0,<2.0.0",
  "httpx>=0.28.0",
  "SQLAlchemy>=2.0.0",
  "alembic>=1.16.0",
  "psycopg[binary]>=3.2.0",
  "redis>=6.0.0",
  "celery>=5.5.0",
  "cryptography>=45.0.0",
  "sentry-sdk[fastapi]>=2.30.0",
  "opentelemetry-distro>=0.57b0",
  "opentelemetry-exporter-otlp>=1.36.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "locust>=2.37.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
markers = [
  "live_provider: mark test to run against live external providers (requires TRUECOST_LIVE_PROVIDER_TESTS=true)",
  "scraper_replay: mark test that requires exported mobile captures from device (skip with -m 'not scraper_replay')",
]
